<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV IPTV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* প্রিমিয়াম ডার্ক থিম UI */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; padding: 15px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 10px; font-size: 22px; font-weight: bold; border-bottom: 1px solid #222; }
        
        .category-list, .channel-list { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        
        .category-item, .channel-item {
            background-color: #1a1a1a; border: 2px solid transparent; padding: 18px 15px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer; text-decoration: none; color: white; font-size: 16px; font-weight: 600; transition: 0.2s;
        }
        
        /* রিমোট বা টাচ ফোকাস হাইলাইট */
        .category-item:focus, .channel-item:focus { border-color: #ffffff; background-color: #333; outline: none; }
        
        /* লাল রঙের কাউন্ট ব্যাজ */
        .count-badge { background-color: #e50914; color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 14px; font-weight: bold; margin-right: 10px; }
        .arrow { color: #888; font-weight: bold; margin-left: 5px; }
        .right-side { display: flex; align-items: center; }

        .back-btn { background: #222; color: #fff; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px; display: none; width: 100%; text-align: left; font-size: 16px; }
        .back-btn:focus { background: #fff; color: #000; outline: none; }

        /* 📺 ভিডিও প্লেয়ার কন্টেইনার (ল্যান্ডস্কেপ ফিক্স করার জন্য) */
        .video-wrapper {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            z-index: 99999;
        }

        video { 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: cover !important; /* কালো বর্ডার বা দাগ দূর করার জন্য */
        }
    </style>
</head>
<body>

    <div class="header" id="nav-header">☰ Live TV</div>
    
    <button class="back-btn" id="backBtn" onclick="showCategories()">← Back to Categories</button>

    <div class="category-list" id="categoryContainer"></div>

    <div class="channel-list" id="channelContainer" style="display: none;"></div>

    <div id="playerWrapper" class="video-wrapper">
        <video id="videoPlayer" controls playsinline></video>
    </div>

    <script>
        // আপনার টেক্সট ফাইলের সব চ্যানেল সরাসরি কোডের ভেতরেই অ্যাড করে দেওয়া হলো
        const tvData = {
            "movies": [
                { name: "Zee Cinema", url: "https://mflixott.com/tv/toffee/live.php?id=zee_cinema&e=.m3u8" },
                { name: "Sony Max", url: "https://mflixott.com/tv/toffee/live.php?id=sony_max&e=.m3u8" },
                { name: "Star Gold", url: "https://mflixott.com/tv/toffee/live.php?id=star_gold&e=.m3u8" },
                { name: "Colors Cineplex", url: "https://mflixott.com/tv/toffee/live.php?id=colors_cineplex&e=.m3u8" },
                { name: "Jalsha Movies", url: "https://mflixott.com/tv/toffee/live.php?id=jalsha_movies&e=.m3u8" }
            ],
            "entertainment": [
                { name: "Zee Bangla", url: "https://mflixott.com/tv/toffee/live.php?id=zee_bangla&e=.m3u8" },
                { name: "Star Jalsha", url: "https://mflixott.com/tv/toffee/live.php?id=star_jalsha&e=.m3u8" },
                { name: "Sony Aath", url: "https://mflixott.com/tv/toffee/live.php?id=sony_atv&e=.m3u8" },
                { name: "Colors Bangla", url: "https://mflixott.com/tv/toffee/live.php?id=colors_bangla&e=.m3u8" },
                { name: "Star Plus", url: "https://mflixott.com/tv/toffee/live.php?id=star_plus&e=.m3u8" },
                { name: "Sony Sab", url: "https://mflixott.com/tv/toffee/live.php?id=sony_sab&e=.m3u8" },
                { name: "Sony TV", url: "https://mflixott.com/tv/toffee/live.php?id=sony_tv&e=.m3u8" }
            ],
            "sports": [
                { name: "T sports", url: "https://tvsen7.aynaott.com/tsports-hd/tracks-v1a1/mono.ts.m3u8" },
                { name: "Sony Ten 1", url: "https://mflixott.com/tv/toffee/live.php?id=sony_ten_1&e=.m3u8" },
                { name: "Sony Ten 2", url: "https://mflixott.com/tv/toffee/live.php?id=sony_ten_2&e=.m3u8" },
                { name: "Sony Sports Ten 5", url: "https://mflixott.com/tv/toffee/live.php?id=sony_six&e=.m3u8" },
                { name: "Star Sports 1", url: "https://mflixott.com/tv/toffee/live.php?id=star_sports_1&e=.m3u8" },
                { name: "Star Sports 2", url: "https://mflixott.com/tv/toffee/live.php?id=star_sports_2&e=.m3u8" },
                { name: "Star Sports Select 1", url: "https://mflixott.com/tv/toffee/live.php?id=star_sports_select_1&e=.m3u8" }
            ],
            "kids": [
                { name: "Nick", url: "https://mflixott.com/tv/toffee/live.php?id=nick&e=.m3u8" },
                { name: "Nick Jr", url: "https://mflixott.com/tv/toffee/live.php?id=sonic_nick&e=.m3u8" }
            ],
            "news": [
                { name: "Discovery", url: "https://mflixott.com/tv/toffee/live.php?id=discovery_sd&e=.m3u8" },
                { name: "Millennium 24 USA", url: "https://app24.jagobd.com.bd/c3VydmVyX8RpbEU9Mi8xNy8yMFDEEHGcfRgzQ6NTAgdEoaeFzbF92YWxIZTO0U0ezN1IzMyfvcEdsEfeDeKiNkVN3PTOmdFseWRtaW51aiPhnPTI2/mnews24.stream/playlist.m3u8" },
                { name: "Millennium TV USA", url: "https://app24.jagobd.com.bd/c3VydmVyX8RpbEU9Mi8xNy8yMFDEEHGcfRgzQ6NTAgdEoaeFzbF92YWxIZTO0U0ezN1IzMyfvcEdsEfeDeKiNkVN3PTOmdFseWRtaW51aiPhnPTI2/millenniumtv-odr-up2.stream/playlist.m3u8" }
            ],
            "music": [
                { name: "NRB TV Canada", url: "https://app24.jagobd.com.bd/c3VydmVyX8RpbEU9Mi8xNy8yMFDEEHGcfRgzQ6NTAgdEoaeFzbF92YWxIZTO0U0ezN1IzMyfvcEdsEfeDeKiNkVN3PTOmdFseWRtaW51aiPhnPTI2/nrbtv.stream/playlist.m3u8" }
            ]
        };

        const categoriesData = [
            { id: "movies", name: "MOVIES HD" },
            { id: "entertainment", name: "ENTERTAINMENT" },
            { id: "sports", name: "SPORTS" },
            { id: "kids", name: "KIDS" },
            { id: "news", name: "NEWS" },
            { id: "music", name: "MUSIC AND OTHERS" }
        ];

        // মেইন স্ক্রিনে ক্যাটাগরি এবং পাশে ইনস্ট্যান্ট লাইভ চ্যানেল কাউন্ট দেখানো
        function displayCategories() {
            const container = document.getElementById('categoryContainer');
            container.innerHTML = "";
            
            categoriesData.forEach((cat, index) => {
                const totalChannels = tvData[cat.id] ? tvData[cat.id].length : 0;
                
                const catItem = document.createElement('button');
                catItem.className = "category-item";
                if(index === 0) catItem.setAttribute('autofocus', 'true'); 
                
                catItem.innerHTML = `
                    <span>${cat.name}</span>
                    <div class="right-side">
                        <span class="count-badge">${totalChannels}</span>
                        <span class="arrow">&gt;</span>
                    </div>
                `;
                catItem.onclick = () => showChannels(cat.id, cat.name);
                container.appendChild(catItem);
            });
        }

        // ক্যাটাগরির ভেতরে চ্যানেলের লিস্ট দেখানো
        function showChannels(catId, catName) {
            document.getElementById('categoryContainer').style.display = 'none';
            document.getElementById('channelContainer').style.display = 'flex';
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('nav-header').innerText = `☰ ${catName}`;

            const container = document.getElementById('channelContainer');
            container.innerHTML = "";

            const channels = tvData[catId] || [];
            if (channels.length === 0) {
                container.innerHTML = "<p style='padding:20px; color:#aaa; text-align:center;'>No channels available in this category.</p>";
                return;
            }

            channels.forEach((channel, index) => {
                const chItem = document.createElement('button');
                chItem.className = "channel-item";
                if(index === 0) chItem.focus(); 
                
                chItem.innerHTML = `<span>${channel.name}</span> <span class="arrow">&gt;</span>`;
                chItem.onclick = () => playLive(channel.url);
                container.appendChild(chItem);
            });
        }

        function showCategories() {
            document.getElementById('categoryContainer').style.display = 'flex';
            document.getElementById('channelContainer').style.display = 'none';
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('nav-header').innerText = "☰ Live TV";
            displayCategories();
        }

        // 🎬 ল্যান্ডস্কেপ মোডে আল্ট্রা ফুল স্ক্রিন প্লে করার লজিক
        function playLive(url) {
            const wrapper = document.getElementById('playerWrapper');
            const video = document.getElementById('videoPlayer');
            
            wrapper.style.display = 'block';
            
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
            }

            video.play();

            // পুরো কন্টেইনারকে ফুলস্ক্রিন করা হচ্ছে
            if (wrapper.requestFullscreen) {
                wrapper.requestFullscreen();
            } else if (wrapper.webkitRequestFullscreen) {
                wrapper.webkitRequestFullscreen();
            } else if (wrapper.mozRequestFullScreen) {
                wrapper.mozRequestFullScreen();
            } else if (wrapper.msRequestFullscreen) {
                wrapper.msRequestFullscreen();
            }

            // 🔄 স্ক্রিনকে ল্যান্ডস্কেপ মোডে লক করা (মোবাইলের অটো রোটেট অন রাখতে হবে)
            setTimeout(() => {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(function(error) {
                        console.log("Orientation lock failed: ", error);
                    });
                }
            }, 200);
        }

        // ফুল স্ক্রিন থেকে বের হলে রিমুভ ও রিসেট লজিক
        document.addEventListener('fullscreenchange', handleExitFullscreen);
        document.addEventListener('webkitfullscreenchange', handleExitFullscreen);
        document.addEventListener('mozfullscreenchange', handleExitFullscreen);
        document.addEventListener('MSFullscreenChange', handleExitFullscreen);

        function handleExitFullscreen() {
            const wrapper = document.getElementById('playerWrapper');
            const video = document.getElementById('videoPlayer');
            
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement && !document.msFullscreenElement) {
                video.pause();
                video.src = ""; 
                wrapper.style.display = 'none';
                
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }
        }

        // টিভি রিমোট সাপোর্ট
        document.addEventListener('keydown', function(event) {
            const active = document.activeElement;
            if (!active) return;

            if (event.key === 'ArrowDown') {
                const next = active.nextElementSibling;
                if (next && next.tagName === 'BUTTON') next.focus();
            } else if (event.key === 'ArrowUp') {
                const prev = active.previousElementSibling;
                if (prev && prev.tagName === 'BUTTON') prev.focus();
            } else if (event.key === 'Enter') {
                active.click();
            } else if (event.key === 'Backspace' || event.key === 'Escape') {
                if (document.getElementById('channelContainer').style.display === 'flex') {
                    showCategories();
                    event.preventDefault();
                }
            }
        });

        // অ্যাপ সরাসরি রান করা হলো
        displayCategories();
    </script>
</body>
</html>
